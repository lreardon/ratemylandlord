services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ratemylandlord
      POSTGRES_PASSWORD: "jJBk6E3InuYx8N-M-mb8Se68GqFaL3ch"
    volumes:
      - ratemylandlord_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "4uVT0iVqaL_nA_cbrDwzcSURYWLGjdRM"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ratemylandlord_test
      POSTGRES_PASSWORD: "DIXpCUKLonWB61bx1pt16A3uSKGhu0JQ"
    volumes:
      - ratemylandlord_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Vs2oRpAB8OMpQdQUuKQOFhkLsB8cLrVA"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  ratemylandlord_data:
  ratemylandlord_test_data:
